name: Instructor grading
description: Run instructor tests and calculate the assignment score
outputs:
  score:
    description: Points earned by this submission
    value: ${{ steps.final-score.outputs.score }}
runs:
  using: composite
  steps:
    - name: Initialize score
      shell: bash
      run: printf 'score=0\n' >> "$GITHUB_ENV"
    - name: Set up Java 24
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '24'
    - name: Run all tests and assign 10 or 100 points
      working-directory: Assignment
      shell: bash
      run: |
        # A failed build/test command is a graded submission, not a failed job.
        # Both student and instructor tests run; no tests must not earn 100.
        score=10
        if mvn --batch-mode --no-transfer-progress \
            -DskipTests=false -Dmaven.test.skip=false \
            -Dmaven.test.failure.ignore=false -DfailIfNoTests=true clean test; then
          score=100
        fi
        printf 'score=%s\n' "$score" >> "$GITHUB_ENV"
        printf 'Assignment score: %s/100\n' "$score"
    # Keep this step last.
    - name: Save final score
      id: final-score
      shell: bash
      run: printf 'score=%s\n' "$score" >> "$GITHUB_OUTPUT"
